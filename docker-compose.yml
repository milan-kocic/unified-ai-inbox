services:
  postgres:
    image: postgres:15-alpine
    container_name: unified-inbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox
      POSTGRES_DB: inbox
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: unified-inbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unified-inbox-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://inbox:inbox@postgres:5432/inbox
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backups:/app/backups
      - ./whatsapp-session:/app/whatsapp-session
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unified-inbox-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
